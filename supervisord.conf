[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:app]
command=node /app/server.js
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOSTNAME="0.0.0.0"
priority=10

[program:worker-audit]
command=npx tsx /app/src/workers/audit-worker.ts
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/worker-audit.log
stderr_logfile=/var/log/supervisor/worker-audit.log
priority=20

[program:worker-blog]
command=npx tsx /app/src/workers/blog-agent-worker.ts
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/worker-blog.log
stderr_logfile=/var/log/supervisor/worker-blog.log
priority=20

[program:worker-gsc]
command=npx tsx /app/src/workers/gsc-sync-worker.ts
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/worker-gsc.log
stderr_logfile=/var/log/supervisor/worker-gsc.log
priority=20
